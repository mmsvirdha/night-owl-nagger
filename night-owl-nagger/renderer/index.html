<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Night Owl</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="card">
    <div class="titlebar">
      <span class="title">🦉 NIGHT OWL</span>
      <button class="close-btn" id="closeBtn" title="Dismiss">✕</button>
    </div>

    <div class="content">
      <div class="owl-wrap">
        <svg viewBox="0 0 120 140" class="owl" id="owl">
          <!-- ears -->
          <polygon points="18,20 34,2 40,26" fill="#5d4e85"/>
          <polygon points="102,20 86,2 80,26" fill="#5d4e85"/>
          <!-- body -->
          <ellipse cx="60" cy="78" rx="52" ry="56" fill="#6c5aa0"/>
          <ellipse cx="60" cy="86" rx="38" ry="42" fill="#8272b8"/>
          <!-- wings -->
          <ellipse cx="20" cy="86" rx="12" ry="26" fill="#5d4e85"/>
          <ellipse cx="100" cy="86" rx="12" ry="26" fill="#5d4e85"/>
          <!-- eyes -->
          <circle cx="40" cy="66" r="20" fill="#fff"/>
          <circle cx="80" cy="66" r="20" fill="#fff"/>
          <circle id="pupilL" cx="40" cy="66" r="9" fill="#241a3d"/>
          <circle id="pupilR" cx="80" cy="66" r="9" fill="#241a3d"/>
          <circle cx="37" cy="63" r="2.5" fill="#fff"/>
          <circle cx="77" cy="63" r="2.5" fill="#fff"/>
          <!-- eyelids for blink animation -->
          <rect id="lidL" x="20" y="46" width="40" height="0" fill="#6c5aa0"/>
          <rect id="lidR" x="60" y="46" width="40" height="0" fill="#6c5aa0"/>
          <!-- beak -->
          <polygon points="52,84 68,84 60,98" fill="#f0a93c"/>
          <!-- feet -->
          <polygon points="42,132 50,132 46,140" fill="#f0a93c"/>
          <polygon points="70,132 78,132 74,140" fill="#f0a93c"/>
        </svg>
      </div>

      <div class="bubble">
        <p id="message">Loading nag…</p>
      </div>
    </div>

    <div class="actions">
      <button id="snoozeBtn" class="btn secondary">5 more minutes</button>
      <button id="sleepBtn" class="btn primary">Ok, going to sleep 😴</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
